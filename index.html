

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense & Budget Visualizer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header Website -->
    <header class="header">
        <h1>Expense & Budget Visualizer</h1>
        <p>Manage and visualize your daily expenses.</p>
    </header>

    <main class="container">

        <!-- Total Balance -->
        <section class="balance-card">
            <h2>Total Balance</h2>
            <p id="total-balance">Rp 0</p>
        </section>

        <!-- Monthly Summary -->
        <section class="monthly-summary-section">
            <h2>Monthly Summary</h2>

            <div class="form-group">
                <label for="summary-month">Select Month</label>
                <input type="month" id="summary-month">
            </div>

            <h3>Monthly Spending</h3>
            <p id="monthly-total">Rp 0</p>

            <p id="monthly-transaction-count">
                0 transactions
            </p>
        </section>

        <!-- Input Form -->
        <section class="form-section">
            <h2>Add Transaction</h2>

            <form id="transaction-form">

                <div class="form-group">
                    <label for="item-name">Item Name</label>
                    <input
                        type="text"
                        id="item-name"
                        placeholder="Enter item name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <!-- Transaction Date -->
                <div class="form-group">
                    <label for="transaction-date">Date</label>
                    <input
                        type="date"
                        id="transaction-date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Fun">Fun</option>
                    </select>
                </div>

                <button type="submit">
                    Add Transaction
                </button>

            </form>
        </section>

        <!-- CUSTOM CATEGORY -->
        <div class="custom-category-section">

            <h3>Manage Categories</h3>

            <form id="category-form">

                <div class="form-group">
                    <label for="new-category">Add New Category</label>

                    <input
                        type="text"
                        id="new-category"
                        placeholder="Example: Education"
                        maxlength="30"
                    >
                </div>

                <button type="submit" id="add-category-button">
                    Add Category
                </button>

            </form>

            <div id="category-list"></div>

        </div>

        <!-- Transaction List -->
        <section class="transactions-section">
            <h2>Transactions</h2>

            <!-- Sorting Transactions -->
            <div class="form-group">
                <label for="transaction-sort">
                    Sort Transactions
                </label>

                <select id="transaction-sort">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="highest">Highest Amount</option>
                    <option value="lowest">Lowest Amount</option>
                    <option value="category">Category A-Z</option>
                </select>
            </div>

            <div id="transaction-list">
                <p class="empty-message">
                    No transactions yet.
                </p>
            </div>
        </section>

        <!-- Visual Chart -->
        <section class="chart-section">
            <h2>Spending by Category</h2>

            <div class="chart-container">
                <canvas id="expense-chart"></canvas>
            </div>
        </section>

    </main>

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>
</html>
